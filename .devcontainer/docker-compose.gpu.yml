# GPU override — merge with docker-compose.yml to enable NVIDIA GPU access.
#
# Requirements:
#   1. NVIDIA driver installed  (nvidia-smi must work on the host)
#   2. NVIDIA Container Toolkit installed:
#        sudo apt-get install -y nvidia-container-toolkit
#        sudo systemctl restart docker
#
# Usage (manually):
#   docker compose -f .devcontainer/docker-compose.yml \
#                  -f .devcontainer/docker-compose.gpu.yml up -d
#
# VS Code: open the command palette → "Dev Containers: Open Folder in Container"
# and select the GPU devcontainer when prompted (devcontainer.gpu.json).

services:
  anymal-dev:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
