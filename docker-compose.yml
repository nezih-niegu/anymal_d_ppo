# =============================================================================
# ANYmal D PPO — Docker Compose
# =============================================================================
# Services
#   train         Polished trainer  (learnable log_std, delta actions)   ← start here
#   train-basic   Basic trainer     (MultivariateNormal, annealed std)
#   sweep         Hyperparameter random-search sweep (polished trainer)
#   render        Generate evaluation videos from best checkpoint
#   video         Generate videos using the basic-trainer checkpoint
#   dashboard     Serve trackio dashboard at http://localhost:7860
#   shell         Drop into a bash shell inside the container (debugging)
#
# GPU support — merge with the GPU override file (launch.sh does this automatically):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up train
#
# Usage examples
#   ./launch.sh                                               ← recommended
#   docker compose up train                                   ← CPU, defaults
#   PYTORCH_INDEX_URL=https://download.pytorch.org/whl/cu121 \
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up train
#   HF_MODEL_REPO=user/anymal-d-ppo HF_TOKEN=hf_... docker compose up train
# =============================================================================

# Shared configuration block (YAML anchor) — all services inherit this.
# The build: stanza lives only on the `train` service so that `docker compose build`
# produces a single image instead of racing to tag the same name in parallel.
x-base: &base
  image: anymal-d-ppo:latest   # shared image tag; built once by the `train` service

  # Map host directories into the container so outputs survive after the
  # container stops. The host directory is created automatically if absent.
  volumes:
    - ./pretrained_models:/app/pretrained_models
    - ./logs:/app/logs
    - ./trackio_data:/root/.cache/huggingface/trackio

  # Environment variables — all optional.
  # Set them in your shell or in a .env file (see .env.example).
  environment:
    - MUJOCO_GL=osmesa
    - MPLBACKEND=Agg
    - PYTHONUNBUFFERED=1
    # Hugging Face Hub integration (leave blank to run fully offline)
    - HF_MODEL_REPO=${HF_MODEL_REPO:-}
    - HF_TOKEN=${HF_TOKEN:-}
    - HF_PRIVATE=${HF_PRIVATE:-1}
    - TRACKIO_SPACE_ID=${TRACKIO_SPACE_ID:-}

  # Remove the container automatically when it exits (keeps things tidy).
  # Change to false if you want to inspect a stopped container.
  restart: "no"

# ---------------------------------------------------------------------------
services:

  # -------------------------------------------------------------------
  # train — Polished trainer: learnable log_std, delta-around-nominal,
  #         shaped reward. Recommended starting point.
  # -------------------------------------------------------------------
  train:
    <<: *base
    build:
      context: .
      # PYTORCH_INDEX_URL is exported by launch.sh based on detected hardware.
      # Falls back to the CPU-only wheel if not set (safe default for CI / manual runs).
      args:
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    command: ["scripts/train_advanced.py", "train"]
    # Note: --live (MuJoCo interactive viewer) does NOT work inside Docker
    # because there is no display server. Use the render service instead.

  # -------------------------------------------------------------------
  # train-basic — MultivariateNormal trainer with annealed std.
  #              Pairs with the `render --basic` service for evaluation.
  # -------------------------------------------------------------------
  train-basic:
    <<: *base
    command: ["scripts/train_basic.py"]

  # -------------------------------------------------------------------
  # sweep — Random hyperparameter search (polished trainer).
  #         Pass --sweep-count N to control the number of trials.
  # -------------------------------------------------------------------
  sweep:
    <<: *base
    command:
      - "scripts/train_advanced.py"
      - "sweep"
      - "--sweep-count"
      - "10"          # override with: docker compose run sweep --sweep-count 30

  # -------------------------------------------------------------------
  # render — Render evaluation MP4 videos from the best checkpoint
  #          (polished trainer by default; add --basic for basic trainer).
  # -------------------------------------------------------------------
  render:
    <<: *base
    command:
      - "scripts/render.py"
      - "--num-videos"
      - "3"

  # -------------------------------------------------------------------
  # video — Render videos from a basic-trainer checkpoint.
  # -------------------------------------------------------------------
  video:
    <<: *base
    command:
      - "scripts/render.py"
      - "--basic"
      - "--num-videos"
      - "3"

  # -------------------------------------------------------------------
  # dashboard — Serve the local trackio dashboard in a browser.
  #   docker compose up dashboard
  #   then open http://localhost:7860
  # -------------------------------------------------------------------
  dashboard:
    <<: *base
    entrypoint: ["trackio", "show"]
    command: ["--project", "AIDL-PPO-ANYMAL_D", "--host", "0.0.0.0"]
    ports:
      - "7860:7860"

  # -------------------------------------------------------------------
  # shell — Interactive bash session inside the container.
  #         Useful for inspecting files, running ad-hoc commands, etc.
  #   docker compose run --rm shell
  # -------------------------------------------------------------------
  shell:
    <<: *base
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
