name: docker-build
on:
  pull_request:
    branches: [main, dev]
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: anymal-d-ppo:test
          cache-from: type=gha
          cache-to: type=gha,mode=max