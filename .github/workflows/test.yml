name: test
on:
  pull_request:
    branches: [main, dev]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt pytest
      - run: |
          set +e
          python -m pytest --tb=short
          code=$?
          if [ $code -eq 5 ]; then
            echo "No tests found — skipping"
          elif [ $code -ne 0 ]; then
            exit $code
          fi
