name: test

on:
  pull_request:
    branches: [main, dev]

jobs:

  install-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt

  yaml-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - name: Parse all YAML files
        run: |
          python - <<'PYEOF'
          import yaml, glob, sys
          files = glob.glob("**/*.yml", recursive=True) + glob.glob("**/*.yaml", recursive=True)
          errors = []
          for f in files:
              try:
                  yaml.safe_load(open(f))
                  print(f"OK: {f}")
              except yaml.YAMLError as e:
                  errors.append(f"FAIL: {f}: {e}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"All {len(files)} YAML files parsed successfully.")
          PYEOF

  python-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Check Python imports
        run: |
          python -c "import torch; print('torch:', torch.__version__)"
          python -c "import numpy; print('numpy:', numpy.__version__)"
          python -c "import yaml; print('yaml OK')"

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt pytest
      - name: Run smoke tests
        run: |
          set +e
          python -m pytest tests/ -v --tb=short
          code=$?
          if [ $code -eq 5 ]; then
            echo "No tests found — skipping"
          elif [ $code -ne 0 ]; then
            exit $code
          fi

  # GPU/MuJoCo workflows separados — requieren runner con GPU
