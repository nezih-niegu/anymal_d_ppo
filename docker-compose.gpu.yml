# =============================================================================
# docker-compose.gpu.yml — NVIDIA GPU override
# =============================================================================
# This file extends docker-compose.yml to enable NVIDIA GPU access inside
# containers. It is merged at runtime by launch.sh when an NVIDIA GPU is
# detected, or manually:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up train
#
# Host requirements (all three must be satisfied):
#   1. NVIDIA driver installed    → nvidia-smi should work
#   2. NVIDIA Container Toolkit   → https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#      Ubuntu/Debian quick-install:
#        distribution=$(. /etc/os-release; echo $ID$VERSION_ID)
#        curl -s -L https://nvidia.github.io/libnvidia-container/gpgkey | sudo apt-key add -
#        curl -s -L https://nvidia.github.io/libnvidia-container/$distribution/libnvidia-container.list \
#          | sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
#        sudo apt-get update && sudo apt-get install -y nvidia-container-toolkit
#        sudo systemctl restart docker
#   3. Image built with CUDA PyTorch (launch.sh does this automatically)
#
# Verify the setup with:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml run --rm shell \
#     python -c "import torch; print('CUDA:', torch.cuda.is_available(), torch.cuda.get_device_name(0))"
#
# Note on the training scripts:
#   Both trainers define `device = torch.device("cuda" if ...)` but do not
#   yet call .to(device) — tensors remain on CPU even with this override.
#   This file is still correct infrastructure; fixing the scripts is a
#   separate task (add .to(device) calls throughout the training loop).
# =============================================================================

# YAML anchor — GPU resource block merged into every service.
x-gpu-resources: &gpu-resources
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all              # expose all GPUs; use count: 1 to limit
            capabilities: [gpu]

# ---------------------------------------------------------------------------
# Override each service to add GPU resource reservations.
# Only the `deploy` key is added; all other settings come from the base file.
# ---------------------------------------------------------------------------
services:
  train:
    <<: *gpu-resources

  train-basic:
    <<: *gpu-resources

  sweep:
    <<: *gpu-resources

  render:
    <<: *gpu-resources

  video:
    <<: *gpu-resources

  shell:
    <<: *gpu-resources
